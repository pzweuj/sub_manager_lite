name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only run if commit message matches version pattern like v0.1.0
    if: |
      contains(github.event.head_commit.message, 'v0.') ||
      contains(github.event.head_commit.message, 'v1.') ||
      contains(github.event.head_commit.message, 'v2.') ||
      contains(github.event.head_commit.message, 'v3.') ||
      contains(github.event.head_commit.message, 'v4.') ||
      contains(github.event.head_commit.message, 'v5.') ||
      contains(github.event.head_commit.message, 'v6.') ||
      contains(github.event.head_commit.message, 'v7.') ||
      contains(github.event.head_commit.message, 'v8.') ||
      contains(github.event.head_commit.message, 'v9.')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Run Rust compatibility tests
        run: cargo test --locked

      - name: Extract version from commit message
        id: version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and smoke-test Rust image
        run: |
          docker build -f Dockerfile -t sub-manager-lite:ci .
          test_dir="$(mktemp -d)"
          trap 'docker rm -f sub-manager-lite-ci >/dev/null 2>&1 || true; rm -rf "$test_dir"' EXIT
          python3 -c 'import sqlite3, sys; c=sqlite3.connect(sys.argv[1]); c.execute("CREATE TABLE subscription (id INTEGER PRIMARY KEY, name VARCHAR NOT NULL, price FLOAT NOT NULL, currency VARCHAR NOT NULL, billing_cycle VARCHAR(7) NOT NULL, ending_date DATE NOT NULL, category VARCHAR NOT NULL, status VARCHAR(8) NOT NULL, auto_renew BOOLEAN NOT NULL)"); c.execute("INSERT INTO subscription VALUES (1, ?, 9.9, ?, ?, ?, ?, ?, 0)", ("Legacy", "CNY", "MONTHLY", "2099-01-01", "其他", "ACTIVE")); c.commit(); c.close()' "$test_dir/sub_manager.db"
          docker run -d --name sub-manager-lite-ci -p 18080:8000 -e API_TOKEN=0123456789abcdef -v "$test_dir:/data" sub-manager-lite:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent -H 'X-API-Token: 0123456789abcdef' http://127.0.0.1:18080/subscriptions/ | grep -q Legacy

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
